name: Pipeline worker

# Background worker for the coaching pipeline — check-in/replan queue processing, KPI
# sync, history backfill. Replaces the macOS LaunchAgents in scripts/ (com.ams.*.plist),
# which only run while the laptop is on and awake. This runs on GitHub's own runners
# instead, independent of the laptop's power state.
#
# Free to run this often: this repo is public, and public repos get unlimited minutes on
# GitHub-hosted runners. The only real cost is Anthropic API usage, which only happens
# when a check-in is actually queued from the phone — same as today, just triggered from
# here instead of a LaunchAgent.
#
# Setup required before this does anything (one-time, no laptop involvement):
#   - Repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_USER_ID,
#     ANTHROPIC_API_KEY (same four vars .env.example documents for local CLI use)
#   - Repo secret AMS_TRAINING_CONFIG: the full contents of my_training_config.yaml.
#     That file is gitignored (contains an email address + personal goals) and this repo
#     is public, so it can't be committed — this secret is how the runner gets it instead.
#   - Repo secret TAILSCALE_AUTHKEY and repo variable TAILSCALE_EXIT_NODE: Garmin rejects
#     logins from GitHub's runner IPs with a 429 (confirmed by testing), but accepts them
#     from a residential IP. All of this job's outbound traffic is routed through a
#     Tailscale exit node running on a Raspberry Pi at home instead, which is the one
#     network path Garmin has actually accepted in testing.

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub's minimum interval — this job decides for itself what actually needs doing
  workflow_dispatch: {}

concurrency:
  group: pipeline-worker
  cancel-in-progress: false # never kill a run that's genuinely mid-job; the next tick just waits

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.2

      - name: Write training config
        run: printf '%s' "$AMS_TRAINING_CONFIG" > my_training_config.yaml
        env:
          AMS_TRAINING_CONFIG: ${{ secrets.AMS_TRAINING_CONFIG }}

      # Confirmed by testing: Garmin's login endpoint 429s every request from GitHub's
      # runner IPs, but accepts requests from a residential IP. Everything below this step
      # — queue processing, KPI sync, history sync — needs to go out through the home Pi,
      # not GitHub's network. If the Pi or home internet is offline, this step fails and
      # the whole job fails with it (by design — better a clear failure than silently
      # falling back to the IP that gets 429'd).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Route outbound traffic through home exit node
        run: sudo tailscale set --exit-node="${{ vars.TAILSCALE_EXIT_NODE }}" --exit-node-allow-lan-access=true

      # Garmin OAuth tokens (~/.garminconnect — services/garmin/client.py's default token
      # dir) and the KPI-sync throttle stamp (~/.ams-kpi-sync — cli/ams.py's _SYNC_STAMP)
      # need to survive between runs. Without this, every 5-minute run would log into
      # Garmin from scratch, which is exactly the repeated-headless-login pattern that
      # raises bot-detection risk — the whole reason this matters more here than it would
      # for a persistent host.
      - name: Restore worker state
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.garminconnect
            ~/.ams-kpi-sync
            ~/.ams-history-sync
          key: ams-worker-state-${{ github.run_id }}
          restore-keys: |
            ams-worker-state-

      - name: Process replan queue
        run: |
          pending=$(curl -sf --max-time 10 \
            "$SUPABASE_URL/rest/v1/replan_jobs?status=eq.pending&select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo '[]')
          if [ "$pending" != "[]" ]; then
            echo "Pending replan job found, running --queue"
            pixi run python cli/ams.py --queue my_training_config.yaml
          else
            echo "Queue empty, skipping"
          fi

      - name: Sync KPIs
        # Self-throttled internally to every 2h via the restored stamp file — safe to
        # call every 5 minutes, most calls are a fast no-op.
        run: pixi run python cli/ams.py --sync-kpis my_training_config.yaml

      - name: Sync history
        # Not internally throttled (unlike --sync-kpis) — gate it here to once/day,
        # same intent as the LaunchAgent's once-nightly StartCalendarInterval.
        run: |
          stamp=~/.ams-history-sync
          now=$(date +%s)
          last=0
          if [ -f "$stamp" ]; then
            last=$(cat "$stamp")
          fi
          elapsed=$(( (now - last) / 3600 ))
          if [ "$elapsed" -ge 20 ]; then
            echo "Last history sync ${elapsed}h ago (or never) — running"
            pixi run python cli/ams.py --sync-history my_training_config.yaml
            echo "$now" > "$stamp"
          else
            echo "History synced ${elapsed}h ago, skipping"
          fi

      - name: Save worker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.garminconnect
            ~/.ams-kpi-sync
            ~/.ams-history-sync
          key: ams-worker-state-${{ github.run_id }}
